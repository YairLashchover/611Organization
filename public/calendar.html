<!DOCTYPE html>
<html lang="he">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<link rel="stylesheet" href="calendar.css">

</head>


<body>


<header class="header">


<div class="back">

<button onclick="window.location.href='/choice'">
← חזרה
</button>

</div>


<div class="username">

<span id="username"></span>

</div>


</header>





<div class="calendar-container">


<div class="week">

<h2>השבוע</h2>

<div class="days" id="thisWeek"></div>

</div>



<div class="week">

<h2>השבוע הבא</h2>

<div class="days" id="nextWeek"></div>

</div>


</div>









<!-- Assignment Popup -->


<div class="modal-overlay" id="modal">


<div class="modal-box">


<div class="modal-header">

<h3 id="modalTitle"></h3>


<button id="close">
×
</button>


</div>



<div id="modalBody">


</div>



</div>


</div>









<script>


let isAdmin=false;

let selectedDate=null;



const dayNames=[

"ראשון",
"שני",
"שלישי",
"רביעי",
"חמישי",
"שישי",
"שבת"

];



const today=new Date();

const currentDay=today.getDay();



const sunday=new Date(today);

sunday.setDate(
    today.getDate()-currentDay
);






function formatDate(date){


let y=date.getFullYear();

let m=String(
    date.getMonth()+1
).padStart(2,"0");


let d=String(
    date.getDate()
).padStart(2,"0");


return `${y}-${m}-${d}`;


}








function isPast(date){


let now=new Date();

now.setHours(0,0,0,0);


let check=new Date(date);

check.setHours(0,0,0,0);



return check<now;


}









function createWeek(id,start,isCurrent){


const container=
document.getElementById(id);



for(let i=0;i<7;i++){



let date=new Date(start);

date.setDate(
    start.getDate()+i
);




let card=document.createElement("div");


card.className="day";





if(isCurrent && i<currentDay){

card.classList.add("past");

}





card.innerHTML=`

<h3>${dayNames[i]}</h3>

<p>
${date.getDate()}/${date.getMonth()+1}
</p>


<div class="day-actions">


<button class="view">
משימות
</button>


${
isAdmin && !isPast(date)
?
`
<button class="edit">
הוסף משימה
</button>
`
:
""
}


</div>


`;







card.querySelector(".view")
.onclick=()=>{

openView(date);

};







let edit=card.querySelector(".edit");


if(edit){


edit.onclick=()=>{

openEdit(date);

};


}





container.appendChild(card);


}



}










function buildCalendar(){


document.getElementById("thisWeek").innerHTML="";

document.getElementById("nextWeek").innerHTML="";



createWeek(
"thisWeek",
sunday,
true
);




let next=new Date(sunday);

next.setDate(
    sunday.getDate()+7
);



createWeek(
"nextWeek",
next,
false
);



}









fetch("/user")

.then(r=>r.json())

.then(data=>{


document.getElementById("username")
.textContent=
"שלום "+data.username;



isAdmin=data.isAdmin;



buildCalendar();



});












// ============================
// View assignments
// ============================



async function openView(date){


selectedDate=date;


let iso=formatDate(date);



openModal(
`${dayNames[date.getDay()]} ${date.getDate()}/${date.getMonth()+1}`
);




let res=
await fetch(
`/api/assignments?date=${iso}`
);



let data=
await res.json();





let html="";





if(data.length===0){


html=
`
<p>
אין משימות
</p>
`;



}
else{



data.forEach(a=>{


html+=`

<div class="assignment">

<b>${a.taskType}</b>

<br>

${a.assignedUser}

<br>

${a.startTime}
-
${a.endTime}


${isAdmin ?
`
<br>
<button onclick="deleteAssignment('${a._id}')">
מחיקה
</button>
`
:
""
}


</div>


`;



});



}



document.getElementById("modalBody")
.innerHTML=html;



}









// ============================
// Admin create assignment
// ============================


async function openEdit(date){


selectedDate=date;


openModal("יצירת משימה");



document.getElementById("modalBody")
.innerHTML=`

<h3>
בחר סוג משימה
</h3>


<button onclick="chooseType('Kitchen')">
מטבח
</button>


<button onclick="chooseType('Guarding')">
שמירה
</button>


`;



}








async function chooseType(type){


document.getElementById("modalBody")
.innerHTML="טוען משתמשים...";



let res=
await fetch("/api/users");


let users=
await res.json();




let html=`

<h3>
בחר משתמש
</h3>

`;



users.forEach(u=>{


html+=`

<button onclick="chooseUser('${type}','${u.username}')">

${u.username}

</button>

`;



});



document.getElementById("modalBody")
.innerHTML=html;



}










function chooseUser(type,user){



document.getElementById("modalBody")
.innerHTML=`

<h3>
${type}
- ${user}
</h3>



<label>
משעה:
</label>


<input id="start" type="time">



<br>


<label>
עד שעה:
</label>


<input id="end" type="time">



<br><br>


<button onclick="saveAssignment('${type}','${user}')">

שמירה

</button>


`;



}










async function saveAssignment(type,user){


let body={


assignedUser:user,


taskType:type,


date:formatDate(selectedDate),


startTime:
document.getElementById("start").value,


endTime:
document.getElementById("end").value



};



await fetch("/api/assignments",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:
JSON.stringify(body)


});



closeModal();


alert("נשמר בהצלחה");


}









async function deleteAssignment(id){


await fetch(
`/api/assignments/${id}`,
{

method:"DELETE"

}

);


closeModal();


openView(selectedDate);



}












// ============================
// Modal
// ============================


function openModal(title){


document.getElementById("modalTitle")
.textContent=title;


document.getElementById("modal")
.classList.add("active");


}



function closeModal(){


document.getElementById("modal")
.classList.remove("active");


}



document.getElementById("close")
.onclick=closeModal;



document.getElementById("modal")
.onclick=e=>{


if(e.target.id==="modal"){

closeModal();

}


};




</script>


</body>

</html>
