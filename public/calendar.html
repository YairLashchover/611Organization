<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<link rel="stylesheet" href="calendar.css">

</head>


<body>


<header class="header">


    <!-- LEFT SIDE -->
    <div class="logout-area">

        <button class="logout-btn" onclick="window.location.href='/choice'">

            יציאה

        </button>

    </div>


    <!-- CENTER -->
    <div class="username">

        <span id="username"></span>

    </div>


    <!-- RIGHT SIDE -->
    <div class="theme-area">

        <button id="themeToggle">

            🌙

        </button>

    </div>


</header>


<div class="calendar-container">


    <div class="week">

        <h2>

            השבוע

        </h2>

        <div class="days" id="thisWeek"></div>

    </div>


    <div class="week">

        <h2>

            השבוע הבא

        </h2>

        <div class="days" id="nextWeek"></div>

    </div>


</div>


<!-- Assignment Popup -->

<div class="modal-overlay" id="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="modalTitle"></h3>

            <button id="close">

                ×

            </button>

        </div>

        <div id="modalBody">

        </div>

    </div>

</div>


<!-- Confirmation Popup -->

<div class="modal-overlay" id="confirmModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>

                אישור

            </h3>

        </div>

        <div id="confirmText">

        </div>

        <div class="confirm-buttons">

            <button id="confirmYes">

                כן

            </button>

            <button id="confirmNo">

                לא

            </button>

        </div>

    </div>

</div>


<script>

let isAdmin=false;

let selectedDate=null;

let pendingAssignment=null;


const dayNames=[

    "ראשון",
    "שני",
    "שלישי",
    "רביעי",
    "חמישי",
    "שישי",
    "שבת"

];


const today=new Date();

const currentDay=today.getDay();


const sunday=new Date(today);

sunday.setDate(

    today.getDate()-currentDay

);


/* ============================
   Date Helpers
============================ */

function formatDate(date){

    let y=date.getFullYear();

    let m=String(
        date.getMonth()+1
    ).padStart(2,"0");

    let d=String(
        date.getDate()
    ).padStart(2,"0");

    return `${y}-${m}-${d}`;

}


function isPast(date){

    let now=new Date();

    now.setHours(
        0,
        0,
        0,
        0
    );

    let check=new Date(date);

    check.setHours(
        0,
        0,
        0,
        0
    );

    return check < now;

}


/* ============================
   Calendar Dots
============================ */

let calendarDots={};


async function loadCalendarDots(){

    let res =
        await fetch("/api/calendar-dots");

    calendarDots =
        await res.json();

}


function createDots(date){

    let iso =
        formatDate(date);

    let tasks =
        calendarDots[iso];

    if(!tasks || tasks.length===0){

        return "";

    }

    let html=
        `<div class="task-dots">`;

    tasks.forEach(task=>{

        let colorClass="";

        if(task.type==="Guarding"){

            colorClass="guard-dot";

        }
        else if(task.type==="Kitchen"){

            colorClass="kitchen-dot";

        }
        else{

            colorClass="other-dot";

        }

        html+=`

            <span class="${colorClass}"></span>

        `;

    });

    html+=`</div>`;

    return html;

}


/* ============================
   Create Week
============================ */

function createWeek(
    id,
    start,
    isCurrent
){

    const container =
        document.getElementById(id);

    for(let i=0;i<7;i++){

        let date =
            new Date(start);

        date.setDate(
            start.getDate()+i
        );

        let card =
            document.createElement("div");

        card.className="day";


        if(isCurrent && i<currentDay){

            card.classList.add("past");

        }


        card.innerHTML=`

            <h3>

                ${dayNames[i]}

            </h3>

            <p>

                ${date.getDate()}/${date.getMonth()+1}

            </p>

            ${createDots(date)}

            <div class="day-actions">

                <button class="view">

                    משימות

                </button>

                ${
                    isAdmin && !isPast(date)

                    ?

                    `

                    <button class="edit">

                        הוסף משימה

                    </button>

                    `

                    :

                    ""

                }

            </div>

        `;


        card.querySelector(".view")
        .onclick=()=>{

            openView(date);

        };


        let edit =
            card.querySelector(".edit");


        if(edit){

            edit.onclick=()=>{

                openEdit(date);

            };

        }


        container.appendChild(card);

    }

}


/* ============================
   Build Calendar
============================ */

async function buildCalendar(){

    await loadCalendarDots();

    document.getElementById("thisWeek")
        .innerHTML="";

    document.getElementById("nextWeek")
        .innerHTML="";


    createWeek(
        "thisWeek",
        sunday,
        true
    );


    let next =
        new Date(sunday);

    next.setDate(
        sunday.getDate()+7
    );


    createWeek(
        "nextWeek",
        next,
        false
    );

}


/* ============================
   Load User
============================ */

fetch("/user")

.then(r=>r.json())

.then(data=>{

    document.getElementById("username")
        .textContent =
        "שלום " + data.username;

    isAdmin =
        data.isAdmin;

    buildCalendar();

});


/* ============================
   View Assignments
============================ */

async function openView(date){

    selectedDate=date;

    let iso =
        formatDate(date);


    openModal(

        `${dayNames[date.getDay()]} ${date.getDate()}/${date.getMonth()+1}`

    );


    let res =
        await fetch(

            `/api/assignments?date=${iso}`

        );


    let data =
        await res.json();


    let html="";


    if(data.length===0){

        html=`

            <p class="modal-empty">

                אין משימות

            </p>

        `;

    }

    else{

        data.forEach(a=>{

            let taskName =
                a.taskType==="Other"

                ?

                a.customName

                :

                (

                    a.taskType==="Kitchen"

                    ?

                    "מטבח"

                    :

                    "שמירה"

                );


            let displayedEndTime =
                a.endTime==="CLOSING"

                ?

                "סגירה"

                :

                a.endTime;


            html+=`

                <div class="assignment">

                    <b>

                        ${taskName}

                    </b>

                    <br>

                    ${a.assignedUser}

                    <br>

                    ${a.startTime}

                    -

                    ${displayedEndTime}

                    ${
                        isAdmin

                        ?

                        `

                        <br>

                        <button onclick="deleteAssignment('${a._id}')">

                            מחיקה

                        </button>

                        `

                        :

                        ""

                    }

                </div>

            `;

        });

    }


    document.getElementById("modalBody")
        .innerHTML =
        html;

}


/* ============================
   Create Assignment
============================ */

async function openEdit(date){

    selectedDate=date;

    openModal("יצירת משימה");


    document.getElementById("modalBody")
        .innerHTML=`

        <h3>

            בחר סוג משימה

        </h3>

        <div class="choice-grid">

            <button class="choice-card choice-kitchen" onclick="chooseType('Kitchen')">

                <span class="choice-icon">🍳</span>
                <span class="choice-label">מטבח</span>

            </button>

            <button class="choice-card choice-guard" onclick="chooseType('Guarding')">

                <span class="choice-icon">🛡️</span>
                <span class="choice-label">שמירה</span>

            </button>

            <button class="choice-card choice-other" onclick="chooseType('Other')">

                <span class="choice-icon">📌</span>
                <span class="choice-label">אחר</span>

            </button>

        </div>

        `;

}


/* ============================
   Choose Task Type
============================ */

async function chooseType(type){

    if(type==="Other"){

        document.getElementById("modalBody")
            .innerHTML=`

            <h3>

                שם המשימה

            </h3>

            <div class="form-field">
                <input id="otherName" placeholder="שם המשימה">
            </div>

            <button class="primary-btn" onclick="chooseOtherName()">

                המשך

            </button>

            `;

        return;

    }

    showUsers(type);

}


/* ============================
   Other Name
============================ */

function chooseOtherName(){

    let name =
        document.getElementById("otherName")
        .value
        .trim();


    if(!name){

        alert("יש להכניס שם משימה");

        return;

    }


    showUsers(
        "Other",
        name
    );

}


/* ============================
   Users
============================ */

async function showUsers(
    type,
    customName=""
){

    document.getElementById("modalBody")
        .innerHTML =
        "טוען משתמשים...";


    let res =
        await fetch("/api/users");

    let users =
        await res.json();


    let html=`

        <h3>

            בחר משתמש

        </h3>

        <div class="choice-grid user-grid">

    `;


    users.forEach(u=>{

        html+=`

            <button class="choice-card user-card" onclick="chooseUser('${type}','${u.username}','${customName}')">

                <span class="choice-label">${u.username}</span>

            </button>

        `;

    });


    html+=`</div>`;


    document.getElementById("modalBody")
        .innerHTML =
        html;

}


/* ============================
   Choose User
============================ */

function chooseUser(
    type,
    user,
    customName=""
){

    /*
       Other keeps the old free time
       selection exactly as before.
    */

    if(type==="Other"){

        showOtherTimeSelection(
            type,
            user,
            customName
        );

        return;

    }


    if(type==="Kitchen"){

        showKitchenTimeOptions(
            user
        );

        return;

    }


    if(type==="Guarding"){

        showGuardingTimeOptions(
            user
        );

        return;

    }

}


/* ============================
   Other Time Selection
============================ */

function showOtherTimeSelection(
    type,
    user,
    customName=""
){

    document.getElementById("modalBody")
        .innerHTML=`

        <h3>

            ${user} - ${customName}

        </h3>

        <div class="time-fields">

            <div class="time-field">
                <label>משעה</label>
                <input id="start" type="time">
            </div>

            <div class="time-field">
                <label>עד שעה</label>
                <input id="end" type="time">
            </div>

        </div>

        <button class="primary-btn" onclick="saveAssignment('${type}','${user}','${customName}')">

            שמירה

        </button>

        `;

}


/* ============================
   Kitchen Time Options
============================ */

function showKitchenTimeOptions(user){

    document.getElementById("modalBody")
        .innerHTML=`

        <h3>

            ${user} - מטבח

        </h3>

        <div class="preset-grid">

            <button class="preset-btn" onclick="saveKitchenPreset('${user}','07:00','14:00')">

                חצי בוקר
                <span class="preset-time">07:00 - 14:00</span>

            </button>

            <button class="preset-btn" onclick="saveKitchenClosing('${user}')">

                חצי ערב
                <span class="preset-time">14:00 - סגירה</span>

            </button>

        </div>

        <button class="custom-btn" onclick="showCustomTimeSelection('Kitchen','${user}')">

            ⚙️ התאמה אישית

        </button>

        `;

}


/* ============================
   Kitchen Closing
============================ */

function saveKitchenClosing(user){

    saveAssignmentDirect(
        "Kitchen",
        user,
        "",
        "14:00",
        "CLOSING"
    );

}


/* ============================
   Kitchen Morning
============================ */

function saveKitchenPreset(
    user,
    start,
    end
){

    saveAssignmentDirect(
        "Kitchen",
        user,
        "",
        start,
        end
    );

}


/* ============================
   Guarding Time Options
============================ */

function showGuardingTimeOptions(user){

    document.getElementById("modalBody")
        .innerHTML=`

        <h3>

            ${user} - שמירה

        </h3>

        <div class="preset-grid preset-grid-2col">

            <button class="preset-btn" onclick="saveGuardingPreset('${user}','00:00','04:00')">

                00:00 - 04:00

            </button>

            <button class="preset-btn" onclick="saveGuardingPreset('${user}','04:00','08:00')">

                04:00 - 08:00

            </button>

            <button class="preset-btn" onclick="saveGuardingPreset('${user}','08:00','12:00')">

                08:00 - 12:00

            </button>

            <button class="preset-btn" onclick="saveGuardingPreset('${user}','12:00','16:00')">

                12:00 - 16:00

            </button>

            <button class="preset-btn" onclick="saveGuardingPreset('${user}','16:00','20:00')">

                16:00 - 20:00

            </button>

            <button class="preset-btn" onclick="saveGuardingPreset('${user}','20:00','00:00')">

                20:00 - 00:00

            </button>

        </div>

        <button class="custom-btn" onclick="showCustomTimeSelection('Guarding','${user}')">

            ⚙️ התאמה אישית

        </button>

        `;

}


/* ============================
   Guarding Preset
============================ */

function saveGuardingPreset(
    user,
    start,
    end
){

    saveAssignmentDirect(
        "Guarding",
        user,
        "",
        start,
        end
    );

}


/* ============================
   Custom Time Selection
============================ */

function showCustomTimeSelection(
    type,
    user,
    customName=""
){

    document.getElementById("modalBody")
        .innerHTML=`

        <h3>

            ${user} -

            ${type==="Kitchen" ? "מטבח" : "שמירה"}

        </h3>

        <div class="time-fields">

            <div class="time-field">
                <label>משעה</label>
                <select id="start" class="time-select">

                    ${generateTimeOptions()}

                </select>
            </div>

            <div class="time-field">
                <label>עד שעה</label>
                <select id="end" class="time-select">

                    ${generateTimeOptions()}

                </select>
            </div>

        </div>

        <button class="primary-btn" onclick="saveAssignment('${type}','${user}','${customName}')">

            שמירה

        </button>

        `;

}


/* ============================
   Generate 5 Minute Options
============================ */

function generateTimeOptions(){

    let html="";

    for(let minutes=0;minutes<24*60;minutes+=5){

        let hours =
            Math.floor(minutes/60);

        let mins =
            minutes%60;

        let value =
            String(hours).padStart(2,"0")
            +
            ":"
            +
            String(mins).padStart(2,"0");


        html+=`

            <option value="${value}">

                ${value}

            </option>

        `;

    }

    return html;

}


/* ============================
   Save Assignment
============================ */

async function saveAssignment(
    type,
    user,
    customName=""
){

    let body={

        assignedUser:user,

        taskType:type,

        customName:customName,

        date:formatDate(selectedDate),

        startTime:
            document.getElementById("start").value,

        endTime:
            document.getElementById("end").value

    };


    let res =
        await fetch("/api/assignments",{

            method:"POST",

            headers:{

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(body)

        });


    let data =
        await res.json();


    if(data.needConfirm){

        showConfirm(

            data.message,

            ()=>{

                body.ignoreLimit=true;

                forceSave(body);

            }

        );

        return;

    }


    if(!res.ok){

        alert(
            data.error ||
            "אירעה שגיאה"
        );

        return;

    }


    closeModal();

    alert("נשמר בהצלחה");

    buildCalendar();

}


/* ============================
   Direct Save
============================ */

async function saveAssignmentDirect(
    type,
    user,
    customName,
    startTime,
    endTime
){

    let body={

        assignedUser:user,

        taskType:type,

        customName:customName,

        date:formatDate(selectedDate),

        startTime:startTime,

        endTime:endTime

    };


    let res =
        await fetch("/api/assignments",{

            method:"POST",

            headers:{

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(body)

        });


    let data =
        await res.json();


    if(data.needConfirm){

        showConfirm(

            data.message,

            ()=>{

                body.ignoreLimit=true;

                forceSave(body);

            }

        );

        return;

    }


    if(!res.ok){

        alert(
            data.error ||
            "אירעה שגיאה"
        );

        return;

    }


    closeModal();

    alert("נשמר בהצלחה");

    buildCalendar();

}


/* ============================
   Force Save
============================ */

async function forceSave(body){

    let res =
        await fetch("/api/assignments",{

            method:"POST",

            headers:{

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(body)

        });


    let data =
        await res.json();


    if(!res.ok){

        alert(
            data.error ||
            "אירעה שגיאה"
        );

        return;

    }


    closeConfirm();

    closeModal();

    alert("נשמר בהצלחה");

    buildCalendar();

}


/* ============================
   Delete
============================ */

async function deleteAssignment(id){

    await fetch(

        `/api/assignments/${id}`,

        {

            method:"DELETE"

        }

    );


    closeModal();

    buildCalendar();

}


/* ============================
   Confirm Modal
============================ */

function showConfirm(
    text,
    yesFunction
){

    pendingAssignment =
        yesFunction;


    document.getElementById("confirmText")
        .innerHTML =
        text;


    document.getElementById("confirmModal")
        .classList.add("active");

}


document.getElementById("confirmYes")
.onclick=()=>{

    if(pendingAssignment){

        pendingAssignment();

    }

};


document.getElementById("confirmNo")
.onclick =
    closeConfirm;


function closeConfirm(){

    document.getElementById("confirmModal")
        .classList.remove("active");

    pendingAssignment=null;

}


/* ============================
   Main Modal
============================ */

function openModal(title){

    document.getElementById("modalTitle")
        .textContent =
        title;

    document.getElementById("modal")
        .classList.add("active");

}


function closeModal(){

    document.getElementById("modal")
        .classList.remove("active");

}


document.getElementById("close")
.onclick =
    closeModal;


document.getElementById("modal")
.onclick=e=>{

    if(e.target.id==="modal"){

        closeModal();

    }

};


/* ============================
   Theme Switch
============================ */

const themeButton =
    document.getElementById("themeToggle");


function loadTheme(){

    let theme =
        localStorage.getItem("theme");

    if(theme==="dark"){

        document.body.classList.add("dark");

        themeButton.textContent="☀️";

    }

}


themeButton.onclick=()=>{

    document.body.classList.toggle("dark");

    let dark =
        document.body.classList.contains("dark");

    localStorage.setItem(

        "theme",

        dark ? "dark" : "light"

    );

    themeButton.textContent =
        dark
        ?
        "☀️"
        :
        "🌙";

};


loadTheme();

</script>


</body>

</html>
