<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<link rel="stylesheet" href="calendar.css">

</head>


<body>


<header class="header">


    <!-- LEFT SIDE -->
    <div class="logout-area">


        <button class="logout-btn" onclick="window.location.href='/choice'">

        יציאה

        </button>


    </div>





    <!-- CENTER -->
    <div class="username">


        <span id="username"></span>


    </div>





    <!-- RIGHT SIDE -->
    <div class="theme-area">


        <button id="themeToggle">

            🌙

        </button>


    </div>



</header>









<div class="calendar-container">



<div class="week">


<h2>

השבוע

</h2>



<div class="days" id="thisWeek"></div>



</div>







<div class="week">


<h2>

השבוע הבא

</h2>



<div class="days" id="nextWeek"></div>



</div>




</div>









<!-- Assignment Popup -->


<div class="modal-overlay" id="modal">



<div class="modal-box">



<div class="modal-header">


<h3 id="modalTitle"></h3>



<button id="close">

×

</button>


</div>





<div id="modalBody">


</div>




</div>


</div>









<!-- Confirmation Popup -->


<div class="modal-overlay" id="confirmModal">



<div class="modal-box">



<div class="modal-header">


<h3>

אישור

</h3>


</div>





<div id="confirmText">


</div>






<div class="confirm-buttons">



<button id="confirmYes">

כן

</button>




<button id="confirmNo">

לא

</button>



</div>




</div>


</div>









<script>


let isAdmin=false;


let selectedDate=null;


let pendingAssignment=null;






const dayNames=[


"ראשון",

"שני",

"שלישי",

"רביעי",

"חמישי",

"שישי",

"שבת"


];






const today=new Date();


const currentDay=today.getDay();





const sunday=new Date(today);



sunday.setDate(

    today.getDate()-currentDay

);









function formatDate(date){


let y=date.getFullYear();



let m=String(
    date.getMonth()+1
).padStart(2,"0");



let d=String(
    date.getDate()
).padStart(2,"0");



return `${y}-${m}-${d}`;


}









function isPast(date){


let now=new Date();


now.setHours(
    0,
    0,
    0,
    0
);



let check=new Date(date);


check.setHours(
    0,
    0,
    0,
    0
);



return check < now;


}









let calendarDots={};







async function loadCalendarDots(){


let res =
await fetch("/api/calendar-dots");



calendarDots =
await res.json();



}









function createDots(date){



let iso =
formatDate(date);




let tasks =
calendarDots[iso];





if(!tasks || tasks.length===0){


return "";


}




let html=
`<div class="task-dots">`;





tasks.forEach(task=>{



let colorClass="";



if(task.type==="Guarding"){


colorClass="guard-dot";


}
else if(task.type==="Kitchen"){


colorClass="kitchen-dot";


}
else{


colorClass="other-dot";


}




html+=`

<span class="${colorClass}"></span>

`;



});




html+=`</div>`;




return html;


}






// ============================
// Create Week
// ============================

function createWeek(
    id,
    start,
    isCurrent
){



const container =
document.getElementById(id);




for(let i=0;i<7;i++){



let date =
new Date(start);



date.setDate(
    start.getDate()+i
);





let card =
document.createElement("div");



card.className="day";






if(isCurrent && i<currentDay){


card.classList.add("past");


}





card.innerHTML=`

<h3>

${dayNames[i]}

</h3>



<p>

${date.getDate()}/${date.getMonth()+1}

</p>



${createDots(date)}




<div class="day-actions">


<button class="view">

משימות

</button>




${
isAdmin && !isPast(date)

?

`

<button class="edit">

הוסף משימה

</button>

`

:

""

}



</div>


`;







card.querySelector(".view")
.onclick=()=>{


openView(date);


};





let edit =
card.querySelector(".edit");



if(edit){


edit.onclick=()=>{


openEdit(date);


};


}



container.appendChild(card);



}


}









// ============================
// Build Calendar
// ============================

async function buildCalendar(){



await loadCalendarDots();




document.getElementById("thisWeek")
.innerHTML="";



document.getElementById("nextWeek")
.innerHTML="";





createWeek(

"thisWeek",

sunday,

true

);





let next =
new Date(sunday);



next.setDate(
    sunday.getDate()+7
);





createWeek(

"nextWeek",

next,

false

);



}









// ============================
// Load User
// ============================

fetch("/user")

.then(r=>r.json())

.then(data=>{


document.getElementById("username")
.textContent =
"שלום " + data.username;



isAdmin =
data.isAdmin;



buildCalendar();



});









// ============================
// View Assignments
// ============================

async function openView(date){



selectedDate=date;




let iso =
formatDate(date);





openModal(

`${dayNames[date.getDay()]} ${date.getDate()}/${date.getMonth()+1}`

);






let res =
await fetch(

`/api/assignments?date=${iso}`

);



let data =
await res.json();





let html="";





if(data.length===0){



html=`

<p class="modal-empty">

אין משימות

</p>

`;



}

else{



data.forEach(a=>{



let taskName =
a.taskType==="Other"
?
a.customName
:
(
a.taskType==="Kitchen"
?
"מטבח"
:
"שמירה"
);






html+=`

<div class="assignment">


<b>

${taskName}

</b>



<br>



${a.assignedUser}



<br>



${a.startTime}

-

${a.endTime}




${
isAdmin

?

`

<br>

<button onclick="deleteAssignment('${a._id}')">

מחיקה

</button>

`

:

""

}



</div>

`;



});



}




document.getElementById("modalBody")
.innerHTML =
html;



}









// ============================
// Create Assignment
// ============================

async function openEdit(date){



selectedDate=date;



openModal("יצירת משימה");





document.getElementById("modalBody")
.innerHTML=`

<h3>

בחר סוג משימה

</h3>



<button onclick="chooseType('Kitchen')">

מטבח

</button>




<button onclick="chooseType('Guarding')">

שמירה

</button>




<button onclick="chooseType('Other')">

אחר

</button>

`;



}









async function chooseType(type){



if(type==="Other"){



document.getElementById("modalBody")
.innerHTML=`

<h3>

שם המשימה

</h3>



<input id="otherName" placeholder="שם המשימה">


<button onclick="chooseOtherName()">

המשך

</button>

`;



return;


}



showUsers(type);



}









function chooseOtherName(){



let name =
document.getElementById("otherName")
.value
.trim();





if(!name){


alert("יש להכניס שם משימה");


return;


}



showUsers(
"Other",
name
);



}









async function showUsers(
type,
customName=""
){



document.getElementById("modalBody")
.innerHTML=
"טוען משתמשים...";





let res =
await fetch("/api/users");



let users =
await res.json();





let html=`

<h3>

בחר משתמש

</h3>

`;





users.forEach(u=>{


html+=`

<button onclick="chooseUser('${type}','${u.username}','${customName}')">

${u.username}

</button>

`;



});





document.getElementById("modalBody")
.innerHTML=
html;



}









function chooseUser(
type,
user,
customName=""
){



document.getElementById("modalBody")
.innerHTML=`

<h3>

${user}

-

${type==="Other" ? customName : type}

</h3>



<label>

משעה:

</label>


<input id="start" type="time">



<br>



<label>

עד שעה:

</label>


<input id="end" type="time">



<br><br>



<button onclick="saveAssignment('${type}','${user}','${customName}')">

שמירה

</button>

`;



}









async function saveAssignment(
type,
user,
customName=""
){



let body={



assignedUser:user,



taskType:type,



customName:customName,



date:formatDate(selectedDate),



startTime:
document.getElementById("start").value,



endTime:
document.getElementById("end").value



};






let res =
await fetch("/api/assignments",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:
JSON.stringify(body)



});





let data =
await res.json();







if(data.needConfirm){



showConfirm(

data.message,

()=>{


body.ignoreLimit=true;


forceSave(body);


}

);



return;



}






closeModal();


alert("נשמר בהצלחה");


buildCalendar();



}









async function forceSave(body){



await fetch("/api/assignments",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:
JSON.stringify(body)



});





closeConfirm();


closeModal();


alert("נשמר בהצלחה");


buildCalendar();



}









// ============================
// Delete
// ============================

async function deleteAssignment(id){


await fetch(

`/api/assignments/${id}`,

{

method:"DELETE"

}

);



closeModal();


buildCalendar();



}









// ============================
// Confirm Modal
// ============================

function showConfirm(
text,
yesFunction
){



pendingAssignment =
yesFunction;




document.getElementById("confirmText")
.innerHTML =
text;




document.getElementById("confirmModal")
.classList.add("active");



}






document.getElementById("confirmYes")
.onclick=()=>{


if(pendingAssignment){


pendingAssignment();


}


};





document.getElementById("confirmNo")
.onclick =
closeConfirm;






function closeConfirm(){


document.getElementById("confirmModal")
.classList.remove("active");



pendingAssignment=null;


}









// ============================
// Main Modal
// ============================

function openModal(title){


document.getElementById("modalTitle")
.textContent =
title;



document.getElementById("modal")
.classList.add("active");


}






function closeModal(){


document.getElementById("modal")
.classList.remove("active");


}





document.getElementById("close")
.onclick =
closeModal;







document.getElementById("modal")
.onclick=e=>{


if(e.target.id==="modal"){


closeModal();


}


};









// ============================
// Theme Switch
// ============================

const themeButton =
document.getElementById("themeToggle");







function loadTheme(){


let theme =
localStorage.getItem("theme");



if(theme==="dark"){



document.body.classList.add("dark");


themeButton.textContent="☀️";


}



}






themeButton.onclick=()=>{



document.body.classList.toggle("dark");



let dark =
document.body.classList.contains("dark");



localStorage.setItem(

"theme",

dark ? "dark" : "light"

);




themeButton.textContent =
dark
?
"☀️"
:
"🌙";



};






loadTheme();





</script>


</body>

</html>
