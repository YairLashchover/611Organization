<!DOCTYPE html>
<html lang="he">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar</title>

    <link rel="stylesheet" href="calendar.css">

</head>

<body>

<header class="header">

    <div class="back">

        <button onclick="window.location.href='/choice'">
            ← חזרה
        </button>

    </div>

    <div class="username">

        <span id="username"></span>

    </div>

</header>


<div class="calendar-container">

    <div class="week">

        <h2>השבוע</h2>

        <div class="days" id="thisWeek"></div>

    </div>


    <div class="week">

        <h2>השבוע הבא</h2>

        <div class="days" id="nextWeek"></div>

    </div>

</div>

<!-- Task Popup -->

<div class="modal-overlay" id="taskModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="modalDate"></h3>

            <button class="modal-close" id="modalClose">&times;</button>

        </div>

        <div class="modal-body" id="modalBody">

            <div class="modal-empty">טוען...</div>

        </div>

    </div>

</div>

<script>

// Will hold whether the logged-in account is an admin,
// decided once /user responds (see fetch("/user") below)
let isAdmin = false;

const dayNames=[
"ראשון",
"שני",
"שלישי",
"רביעי",
"חמישי",
"שישי",
"שבת"
];

const today=new Date();

const currentDay=today.getDay();


// Sunday of current week
const sunday=new Date(today);

sunday.setDate(today.getDate()-currentDay);


// Turn a Date into "YYYY-MM-DD" so it can be used as a
// stable key for the DayNote API (independent of locale/format)
function toISODate(d){

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;

}


function createWeek(container,startDate,isCurrentWeek){

    const div=document.getElementById(container);

    for(let i=0;i<7;i++){

        const d=new Date(startDate);

        d.setDate(startDate.getDate()+i);

        const card=document.createElement("div");

        card.className="day";

        if(isCurrentWeek && i<currentDay){

            card.classList.add("past");

        }

        card.innerHTML=
        `
        <h3>${dayNames[i]}</h3>
        <p>${d.getDate()}/${d.getMonth()+1}</p>
        <div class="day-actions">
            <button type="button" class="day-btn view-btn">משימות</button>
            ${isAdmin ? '<button type="button" class="day-btn edit-btn">עריכה</button>' : ""}
        </div>
        `;

        const viewBtn = card.querySelector(".view-btn");

        viewBtn.addEventListener("click", (e)=>{
            e.stopPropagation();
            openTaskModal(d,false);
        });

        const editBtn = card.querySelector(".edit-btn");

        if(editBtn){

            editBtn.addEventListener("click", (e)=>{
                e.stopPropagation();
                openTaskModal(d,true);
            });

        }

        div.appendChild(card);

    }

}

function buildCalendar(){

    // Clear in case this ever gets called more than once
    document.getElementById("thisWeek").innerHTML = "";
    document.getElementById("nextWeek").innerHTML = "";

    createWeek("thisWeek",sunday,true);

    const nextSunday=new Date(sunday);

    nextSunday.setDate(sunday.getDate()+7);

    createWeek("nextWeek",nextSunday,false);

}


// Username + admin check, then build the calendar
fetch("/user")
.then(r=>r.json())
.then(data=>{

    document.getElementById("username").textContent="שלום " + data.username;

    isAdmin = !!data.isAdmin;

    buildCalendar();

});


// ============================
// Task Popup
// ============================

const taskModal = document.getElementById("taskModal");
const modalDate = document.getElementById("modalDate");
const modalBody = document.getElementById("modalBody");
const modalClose = document.getElementById("modalClose");

async function openTaskModal(date, editMode){

    const label = `${dayNames[date.getDay()]} ${date.getDate()}/${date.getMonth()+1}`;
    const isoDate = toISODate(date);

    modalDate.textContent = label;
    modalBody.innerHTML = `<div class="modal-empty">טוען...</div>`;
    taskModal.classList.add("active");

    // Load whatever is currently saved for this date
    let content = "";

    try{

        const res = await fetch(`/api/daynotes/${isoDate}`);

        if(res.ok){
            const data = await res.json();
            content = data.content || "";
        }

    }catch(err){

        console.log("Failed to load day note", err);

    }

    if(editMode){

        modalBody.innerHTML =
            `<textarea id="modalEditArea" class="modal-edit-area" placeholder="כתוב כאן משימות..."></textarea>
            <button type="button" class="modal-save-btn" id="modalSaveBtn">שמור</button>`;

        document.getElementById("modalEditArea").value = content;

        document.getElementById("modalSaveBtn").addEventListener("click", async ()=>{

            const newText = document.getElementById("modalEditArea").value.trim();

            try{

                await fetch(`/api/daynotes/${isoDate}`, {
                    method:"PUT",
                    headers:{"Content-Type":"application/json"},
                    body: JSON.stringify({content:newText})
                });

            }catch(err){

                console.log("Failed to save day note", err);

            }

            renderNoteView(newText);

        });

    } else {

        renderNoteView(content);

    }

}

function renderNoteView(content){

    modalBody.innerHTML = content
        ? `<div class="modal-text"></div>`
        : `<div class="modal-empty">אין עדיין משימות</div>`;

    if(content){
        modalBody.querySelector(".modal-text").textContent = content;
    }

}

function closeTaskModal(){

    taskModal.classList.remove("active");

}

modalClose.addEventListener("click", closeTaskModal);

taskModal.addEventListener("click", (e)=>{
    if(e.target === taskModal){
        closeTaskModal();
    }
});

document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && taskModal.classList.contains("active")){
        closeTaskModal();
    }
});

</script>

</body>

</html>
