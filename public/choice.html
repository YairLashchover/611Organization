<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choice</title>

    <link rel="stylesheet" href="choice.css">
</head>

<body>

    <header class="header">

        <!-- BACK BUTTON - TOP LEFT -->
        <button class="back-btn" onclick="window.location.href='/verification.html'">
            חזרה
        </button>


        <!-- USERNAME - CENTER -->
        <div class="username">

            <span id="username">Username</span>

            <script>
                fetch("/user")
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById("username").textContent =
                            "שלום " + data.username;
                    });
            </script>

        </div>

    </header>


    <main class="container">

        <div class="choice-card">

            <h1>
                :בחר סביבת עבודה
            </h1>


            <div class="buttons">

                <button class="choice-btn" onclick="window.location.href='/calendar'">
                    לו"ז
                </button>

                <button class="choice-btn">
                    ציוד
                </button>

            </div>

        </div>

    </main>


</body>

</html>
